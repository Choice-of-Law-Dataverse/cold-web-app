[project]
name = "backend"
version = "1.4.1"
description = "cold-backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "email-validator==2.3.0",
    "fastapi==0.161.1",
    "griffe>=2.4.1",
    "logfire[fastapi,httpx,psycopg2,requests,sqlalchemy]>=5.2.0",
    "openai>=3.37.0",
    "openai-agents>=0.24.0",
    "psycopg2-binary==2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]==2.15.1",
    "pymupdf4llm>=1.28.2,<2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "rapidfuzz>=3.14.6",
    "requests==2.34.2",
    "resend>=2.50.0",
    "sqlalchemy==2.0.55",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "iniconfig>=2.3.1",
    "mypy-extensions>=1.1.0",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "platformdirs>=4.13.5",
    "pluggy>=1.7.0",
    "polyfactory>=3.5.0",
    "pre-commit>=4.7.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pyright>=1.1.414",
    "vulture>=2.16",
]

[tool.uv]
package = true

[project.scripts]
serve = "app.main:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]
isort = { combine-as-imports = true, known-first-party = ["app"], known-third-party = ["alembic"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]
