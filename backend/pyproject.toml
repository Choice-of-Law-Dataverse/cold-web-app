[project]
name = "backend"
version = "1.4.0"
description = "cold-backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.1",
    "email-validator==2.2.0",
    "fastapi==0.115.6",
    "griffe>=1.15.0,<2",
    "logfire[fastapi,httpx,psycopg2,requests,sqlalchemy]>=5.1.0",
    "openai>=3.14.0",
    "openai-agents>=0.22.2",
    "psycopg2-binary==2.9.9",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]==2.10.1",
    "pymupdf4llm>=1.28.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "rapidfuzz>=3.14.6",
    "requests==2.32.3",
    "resend>=2.45.0",
    "sqlalchemy==2.0.31",
    "urllib3==2.3.0",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "iniconfig>=2.3.0",
    "mypy-extensions>=1.1.0",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "platformdirs>=4.11.8",
    "pluggy>=1.6.0",
    "polyfactory>=3.3.0",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "pyright>=1.1.414",
    "vulture>=2.16",
]

[tool.uv]
package = true

[project.scripts]
serve = "app.main:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]
isort = { combine-as-imports = true, known-first-party = ["app"], known-third-party = ["alembic"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]
