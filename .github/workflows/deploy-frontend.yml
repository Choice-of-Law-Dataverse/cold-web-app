name: Manual deployment of cold-frontend

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://cold.global

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Azure Key Vault
        uses: azure/cli@v3
        id: fetch-secrets
        with:
          inlineScript: |
            SECRETS="AUTH0-AUDIENCE AUTH0-CLIENT-ID AUTH0-CLIENT-SECRET AUTH0-SECRET NUXT-SITE-URL"
            for secret in $SECRETS; do
              value=$(az keyvault secret show --vault-name cold-key-vault --name $secret --query value -o tsv)
              echo "::add-mask::$value"
              output_name=$(echo $secret | tr '-' '_')
              echo "$output_name=$value" >> $GITHUB_OUTPUT
            done

      - name: Configure Auth0 runtime secrets
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp secret set \
              --name cold-frontend \
              --resource-group cold \
              --secrets \
                auth0-audience="${{ steps.fetch-secrets.outputs.AUTH0_AUDIENCE }}" \
                auth0-client-id="${{ steps.fetch-secrets.outputs.AUTH0_CLIENT_ID }}" \
                auth0-client-secret="${{ steps.fetch-secrets.outputs.AUTH0_CLIENT_SECRET }}" \
                auth0-session-secret="${{ steps.fetch-secrets.outputs.AUTH0_SECRET }}"
            az containerapp update \
              --name cold-frontend \
              --resource-group cold \
              --set-env-vars \
                NUXT_AUTH0_AUDIENCE=secretref:auth0-audience \
                NUXT_AUTH0_CLIENT_ID=secretref:auth0-client-id \
                NUXT_AUTH0_CLIENT_SECRET=secretref:auth0-client-secret \
                NUXT_AUTH0_SESSION_SECRET=secretref:auth0-session-secret

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/frontend
          imageToBuild: choiceoflawdataverse/cold-frontend:${{ github.sha }}
          registryPassword: ${{ secrets.COLDFRONTEND_REGISTRY_PASSWORD }}
          registryUrl: docker.io
          registryUsername: ${{ secrets.COLDFRONTEND_REGISTRY_USERNAME }}
          ingress: external
          containerAppName: cold-frontend
          resourceGroup: cold
          targetPort: 3000
          buildArguments: |
            NUXT_SITE_URL=${{ steps.fetch-secrets.outputs.NUXT_SITE_URL }}
